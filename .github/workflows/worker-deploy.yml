# Despliega el worker en Fly cuando cambia algo en worker/ (o a mano desde Actions → "Desplegar worker" → Run workflow).
# Necesita el secreto FLY_API_TOKEN en GitHub: un token de deploy de la app del worker (Fly → app → Tokens).
name: Desplegar worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Desplegar
        run: flyctl deploy --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
