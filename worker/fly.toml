# fly.toml app configuration file generated for content2-worker-juampi on 2026-10-21T19:59:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'content2-worker-juampi'
primary_region = 'gru'
kill_signal = 'SIGTERM'
kill_timeout = '1m0s'

[build]
  dockerfile = 'Dockerfile'

[env]
  IDLE_EXIT_MINUTES = '5'
  LEASE_SECONDS = '90'
  LOG_LEVEL = 'INFO'
  X264_PRESET = 'slow'

[[mounts]]
  source = 'work'
  destination = '/data'
  initial_size = '20gb'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '10gb'
  auto_extend_size_limit = '60gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[restart]]
  policy = 'on-failure'
  retries = 3

[[vm]]
  size = 'performance-4x'
  memory = '8gb'
