name: bajar
on:
  push:
    branches: [tmp-descargas]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -d out ]; then exit 0; fi
          mkdir -p out
          while read -r name url; do [ -n "$name" ] && (curl -fsSL -A "Mozilla/5.0" -o "out/$name" "$url" || echo "fallo $name"); done < urls.txt
          ls -la out
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out && git commit -m "archivos" && git push
