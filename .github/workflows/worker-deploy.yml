# Despliega el worker en Fly cuando cambia algo en worker/ (o a mano desde Actions → "Desplegar worker" → Run workflow).
# Necesita el secreto FLY_API_TOKEN en GitHub: un token de deploy de la app del worker (Fly → app → Tokens).
name: Desplegar worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-deploy.yml"]
  workflow_dispatch:
    inputs:
      recrear_volumen:
        description: "Borrar el volumen de caché sin máquina y crear uno nuevo (si Fly dice que no hay capacidad en ese host)"
        type: boolean
        default: false

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker
    # La app de Fly de esta marca va en la variable de repo FLY_WORKER_APP (content2-worker-<marca>).
    if: ${{ vars.FLY_WORKER_APP != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recrear volumen de caché
        if: ${{ inputs.recrear_volumen }}
        # El volumen solo guarda caché de trabajo: borrarlo no pierde nada del cliente.
        run: |
          for id in $(flyctl volumes list --config fly.toml --app "${{ vars.FLY_WORKER_APP }}" --json | jq -r '.[] | select(.name=="work" and (.attached_machine_id // "") == "") | .id'); do
            flyctl volumes destroy "$id" --config fly.toml --app "${{ vars.FLY_WORKER_APP }}" --yes
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Desplegar
        run: flyctl deploy --config fly.toml --app "${{ vars.FLY_WORKER_APP }}" --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
