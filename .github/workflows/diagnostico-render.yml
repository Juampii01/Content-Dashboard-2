# Diagnóstico de un render, solo lectura: corre worker/diag_render.py en la máquina del worker (lo que mandó la app y
# las duraciones de los archivos de trabajo) y muestra los últimos registros del worker. A mano desde Actions.
name: Diagnóstico de render

on:
  # Se pide escribiendo el id del proyecto en .github/diag/proyecto (y subiéndolo a main).
  push:
    branches: [main]
    paths: [".github/diag/**"]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validar el id
        id: pid
        run: |
          pid=$(tr -d '[:space:]' < ../.github/diag/proyecto)
          echo "$pid" | grep -Eq '^[0-9a-f-]{36}$'
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
      - name: Encender la máquina
        run: |
          for id in $(flyctl machines list --config fly.toml --json | jq -r '.[].id'); do flyctl machines start "$id" --config fly.toml || true; done
          sleep 20
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Diagnóstico
        run: |
          flyctl ssh console --config fly.toml -C "python /app/diag_render.py ${{ steps.pid.outputs.pid }}" | sed -E 's#https?://[^" ]+#<url>#g' | tee /tmp/diag.txt
          # Historial de trabajos y plan guardado (el script va desde el repo: no hace falta redesplegar el worker).
          b64=$(base64 -w0 ../.github/diag/diag_proyecto.py)
          flyctl ssh console --config fly.toml -C "sh -c 'echo $b64 | base64 -d > /tmp/diag_proyecto.py && cd /app && python /tmp/diag_proyecto.py ${{ steps.pid.outputs.pid }}'" 2>&1 | grep -v "^Connecting" | sed -E 's#https?://[^" ]+#<url>#g' | tee -a /tmp/diag.txt || true
          t64=$(base64 -w0 ../.github/diag/trabajos.py)
          flyctl ssh console --config fly.toml -C "sh -c 'echo $t64 | base64 -d > /tmp/trabajos.py && cd /app && python /tmp/trabajos.py'" 2>&1 | grep -v "^Connecting" | tee -a /tmp/diag.txt || true
          c64=$(base64 -w0 ../.github/diag/costos_videos.py)
          flyctl ssh console --config fly.toml -C "sh -c 'echo $c64 | base64 -d > /tmp/costos_videos.py && cd /app && python /tmp/costos_videos.py'" 2>&1 | grep -v "^Connecting" | tee -a /tmp/diag.txt || true
          # Costo de infraestructura (últimos 30 días) y la máquina de Fly.
          flyctl ssh console --config fly.toml -C "sh -c 'cd /app && python diag_costos.py'" 2>&1 | grep -v "^Connecting" | tee -a /tmp/diag.txt || true
          flyctl machines list --config fly.toml --json | jq '[.[] | {id, state, region, size: .config.guest}]' | tee -a /tmp/diag.txt || true
          flyctl volumes list --config fly.toml --json | jq '[.[] | {name, size_gb, region}]' | tee -a /tmp/diag.txt || true
          # Separación de voz (Biblioteca → Sacar la música de un reel): el modelo carga y cuánto tarda en esta máquina.
          flyctl ssh console --config fly.toml -C "sh -c 'cd /app && python diag_separar.py'" 2>&1 | tail -5 | tee -a /tmp/diag.txt || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Registros del worker
        run: flyctl logs --config fly.toml --no-tail | grep -Ei "sincron|render|tramo|audio|error|setup-token|claude|ia |CLAUDE_LOGIN|agente|equivalente|ventana|compos|director|animaci|comunicarnos|worker.app|timed out|Traceback" | sed -E 's#https?://[^" ]+#<url>#g' | tail -300 | tee /tmp/logs.txt
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Guarda la salida en la rama diag-salida (los registros de Actions no siempre se pueden leer desde afuera).
      - name: Guardar la salida
        if: always()
        working-directory: .
        run: |
          git config user.name "diag" && git config user.email "diag@users.noreply.github.com"
          git checkout --orphan diag-salida
          git rm -rq --cached . && git clean -fdq -e .git
          cp /tmp/diag.txt diag.txt 2>/dev/null || true; cp /tmp/logs.txt logs.txt 2>/dev/null || true
          git add diag.txt logs.txt 2>/dev/null || true
          git commit -qm "Diagnóstico ${{ steps.pid.outputs.pid }}" && git push -qf origin diag-salida
