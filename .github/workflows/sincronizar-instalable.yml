# Arma el repo instalable desde el commit actual de main y lo sube (scripts/armar-instalable.sh). Se corre a mano
# (Actions → «Sincronizar repo instalable» → Run workflow). Se frena si encuentra datos o secretos que no deberían ir.
# Necesita: variable de repo INSTALABLE_REPO (dueño/nombre) y secreto INSTALABLE_DEPLOY_KEY (deploy key con escritura
# en ese repo; la pública se agrega en el repo instalable → Settings → Deploy keys).
name: Sincronizar repo instalable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Clonar el repo instalable
        env:
          KEY: ${{ secrets.INSTALABLE_DEPLOY_KEY }}
        run: |
          [ -n "${{ vars.INSTALABLE_REPO }}" ] || { echo "Falta la variable INSTALABLE_REPO."; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/instalable && chmod 600 ~/.ssh/instalable
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/instalable" git clone "git@github.com:${{ vars.INSTALABLE_REPO }}.git" ../instalable
      - name: Armar
        run: scripts/armar-instalable.sh ../instalable
      - name: Subir
        working-directory: ../instalable
        run: |
          git config user.name "sincronizacion" && git config user.email "sincronizacion@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Sincronizado desde el repo principal ($(cat .origen))"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/instalable" git push origin HEAD:main
